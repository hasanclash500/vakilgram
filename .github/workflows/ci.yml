name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/create-runtime-audit-manifest.mjs
      - run: npm install --package-lock-only --ignore-scripts
        working-directory: .runtime-audit
      - run: npm audit --audit-level=high
        working-directory: .runtime-audit

  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/vakilgram
      DIRECT_URL: postgresql://user:pass@127.0.0.1:5432/vakilgram
      NEXT_PUBLIC_FEATURE_VOICE: "true"
      AUTH_SECRET: ci-only-not-for-production-change-me
      AUTH_TRUST_HOST: "true"
      SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: vakilgram
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d vakilgram"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/vakilgram
      DIRECT_URL: postgresql://user:pass@127.0.0.1:5432/vakilgram
      LEGAL_ASK_RATE_LIMIT: "2"
      LEGAL_ASK_RATE_WINDOW_SECONDS: "600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run test:integration
